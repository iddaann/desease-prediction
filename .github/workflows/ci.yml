name: HealthPredict CI

on:
  push:
    branches:
      - main
      - srs-implementation
  pull_request:
    branches:
      - main

jobs:
  ml-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python modules
        run: python -m compileall api src scripts

      - name: Audit dataset
        run: python scripts/dataset_audit.py

      - name: Train model
        run: python -m src.train

      - name: Compare baseline models
        run: python scripts/model_compare.py

services:
  - type: web
    name: healthpredict
    runtime: docker
    region: singapore
    plan: starter
    dockerfilePath: ./DockerFile
    dockerContext: .
    dockerCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: ADMIN_NAME
        value: Administrator
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: healthpredict-db
          property: connectionString
      - key: CORS_ORIGINS
        value: ""

databases:
  - name: healthpredict-db
    databaseName: healthpredict
    plan: free
